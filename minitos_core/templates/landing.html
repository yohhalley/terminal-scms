{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTOS - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fbdcb1 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            border-top: 5px solid #f56c2c;
        }
        
        .logo {
            margin-bottom: 30px;
            max-width: 150px;
            height: auto;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #f56c2c;
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        p {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #ff8c42;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            margin: 10px 5px;
        }
        
        .btn:hover {
            background: #b5570f;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 140, 66, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn-secondary {
            background: #666;
        }
        
        .btn-secondary:hover {
            background: #444;
            box-shadow: 0 10px 20px rgba(100, 100, 100, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{% static 'images/terminal_velocity_logo.png' %}" alt="Company Logo" class="logo">
        <p class="subtitle">Terminal Velocity</p>
        <h1>Welcome to MiniTOS</h1>
        <p>Container Terminal Operating System</p>
        <div class="btn-group">
            <a href="/terminal-editor/" class="btn btn-secondary">Terminal Editor</a>
            <a href="/admin" class="btn">Admin Panel</a>
        </div>
    </div>
</body>
</html>
