name: SCMS tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  minitos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: minitos_test
          POSTGRES_USER: minitos
          POSTGRES_PASSWORD: minitos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minitos -d minitos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key
      DB_NAME: minitos_test
      DB_USER: minitos
      DB_PASSWORD: minitos
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: apps/minitos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/minitos/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: node --test minitos_core/static/terminal_editor_map_tools.test.js minitos_core/static/terminal_editor_render.test.js

  terminal-oes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/terminal-oes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/terminal-oes/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  simulator-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v -s apps/simulator-runner -p 'test_*.py'

  # Headless Godot unit suites (TCL-029). They use fakes for MQTT and OES, so no
  # broker or credentials are needed. A non-zero exit, a hang (timeout) or any
  # "SCRIPT ERROR" in the output fails the step (.github/scripts/run-godot-test.sh).
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/godot-open-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --editor --path . --quit
      - name: test_headless_sim.gd
        run: ../../.github/scripts/run-godot-test.sh 600 tests/unit/test_headless_sim.gd
      - name: test_terminal_integration.gd
        run: ../../.github/scripts/run-godot-test.sh 600 tests/unit/test_terminal_integration.gd
      - name: test_che_rails.gd
        run: ../../.github/scripts/run-godot-test.sh 600 tests/unit/test_che_rails.gd
      - name: test_cancel_regression.gd
        run: ../../.github/scripts/run-godot-test.sh 600 tests/unit/test_cancel_regression.gd

  # Optional: live MQTT lifecycle against HiveMQ CE (same image as compose.yaml).
  # It does not block the workflow; promote it once it has proven stable.
  godot-mqtt-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    services:
      hivemq:
        image: hivemq/hivemq-ce:2026.5
        ports:
          - 1883:1883
    env:
      MQTT_TEST_HOST: 127.0.0.1
      MQTT_TEST_PORT: "1883"
    defaults:
      run:
        working-directory: clients/godot-open-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Wait for the broker
        run: |
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo "HiveMQ did not open port 1883" >&2
          exit 1
      - name: Import project
        run: timeout 300 "$GODOT_BIN" --headless --editor --path . --quit
      - name: test_local_mqtt_broker.gd
        run: ../../.github/scripts/run-godot-test.sh 120 tests/integration/test_local_mqtt_broker.gd
