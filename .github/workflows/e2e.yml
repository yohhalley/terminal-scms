name: SCMS e2e (S1 slice)

# TCL-007 (T-001, D-021): full compose stack + compose simulator-runner (Godot
# imported in the runner image at build, #29/#35) with the TCL-034 fast timing
# profile, reset to import_v1, visit-in-operation, run the S1 slice and assert
# the UNS business events with a <= 5 s limit per step (D-037). Flaky runs get
# a ticket, never a looser limit.
# Not a required check: allowed to fail until it has been green on main 3 runs in a row.

on:
  pull_request:
    # Draft PRs run too (the default types do not filter drafts; listed explicitly).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s1-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: terminal-scms
      E2E_STEP_LIMIT_S: "5"        # D-037. Do not raise; open a flaky-run ticket instead.
      E2E_TIME_SCALE: "1"          # session time_scale; CI timing comes from the fast profile
      SIMULATOR_TIMING_PROFILE: fast
      E2E_REPORT_DIR: e2e-report
      E2E_RERUN: "1"               # D-016 rerun pass (M2 is on main)
      RUNNER_IDENTITY: ci-e2e
      RUNNER_POLL_INTERVAL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install the e2e runner
        run: python -m pip install -r tests/e2e/requirements.txt

      - name: Runner self-test
        run: python -m unittest discover -v -s tests/e2e -p 'test_*.py'

      - name: Create a throwaway .env (generated per run, never uploaded)
        run: |
          cp .env.example .env
          runner_token="$(openssl rand -hex 32)"
          oes_token="$(openssl rand -hex 32)"
          echo "::add-mask::$runner_token"
          echo "::add-mask::$oes_token"
          sed -i \
            -e "s/^SIMULATOR_RUNNER_TOKEN=.*/SIMULATOR_RUNNER_TOKEN=$runner_token/" \
            -e "s/^OES_API_TOKEN=.*/OES_API_TOKEN=$oes_token/" \
            -e "s/^SIMULATOR_TIMING_PROFILE=.*/SIMULATOR_TIMING_PROFILE=fast/" \
            -e "s/^RUNNER_IDENTITY=.*/RUNNER_IDENTITY=ci-e2e/" \
            -e "s/^RUNNER_POLL_INTERVAL=.*/RUNNER_POLL_INTERVAL=1/" .env
          {
            echo "SIMULATOR_RUNNER_TOKEN=$runner_token"
            echo "OES_API_TOKEN=$oes_token"
          } >> "$GITHUB_ENV"
          docker compose config --quiet

      # Official import (#29/#35): the simulator-runner image runs
      # .github/scripts/godot-import.sh at build as the godot user. The
      # standalone godot-simulator image is not built or started.
      - name: Build images (incl. the simulator-runner Godot import)
        run: |
          docker compose build
          docker compose --profile simulation build simulator-runner

      - name: Start the stack and wait for health
        run: docker compose up --detach --wait --wait-timeout 300

      - name: Start the simulator-runner service
        run: docker compose --profile simulation up --detach --wait --wait-timeout 300 simulator-runner

      - name: Reset to import_v1
        run: make scenario-reset SCENARIO=import_v1

      - name: Visit InOperation (creates the discharge orders)
        run: make scenario-step SCENARIO=import_v1 STEP=visit-in-operation

      - name: Run the S1 slice
        run: python tests/e2e/s1_slice.py --report-dir "$E2E_REPORT_DIR"

      - name: Reset and rerun (D-016)
        if: env.E2E_RERUN == '1'
        run: |
          make scenario-reset SCENARIO=import_v1
          make scenario-step SCENARIO=import_v1 STEP=visit-in-operation
          python tests/e2e/s1_slice.py --report-dir "$E2E_REPORT_DIR/rerun" \
            --compare-with "$E2E_REPORT_DIR/s1_slice.json"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$E2E_REPORT_DIR/logs"
          docker compose --profile simulation ps --all > "$E2E_REPORT_DIR/logs/compose-ps.txt" 2>&1 || true
          docker compose --profile simulation logs --timestamps --no-color > "$E2E_REPORT_DIR/logs/compose.log" 2>&1 || true
          rm -f .env

      - name: Upload the e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-s1-report
          path: |
            ${{ env.E2E_REPORT_DIR }}/*.md
            ${{ env.E2E_REPORT_DIR }}/*.json
            ${{ env.E2E_REPORT_DIR }}/*.jsonl
            ${{ env.E2E_REPORT_DIR }}/rerun/
          if-no-files-found: warn

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-s1-logs
          path: ${{ env.E2E_REPORT_DIR }}/logs/
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose --profile simulation down --volumes --remove-orphans || true
