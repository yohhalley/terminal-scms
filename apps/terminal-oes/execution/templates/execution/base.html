<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Terminal OES{% endblock %}</title>
  <style>
    :root {
      --ink: #18201f;
      --muted: #66706f;
      --line: #d6dcda;
      --panel: #ffffff;
      --surface: #f3f6f4;
      --header: #202927;
      --green: #147d64;
      --green-soft: #e0f1eb;
      --amber: #b76a13;
      --red: #b23a3a;
      --blue: #2d678c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      height: 54px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 24px;
      color: #f7faf8;
      background: var(--header);
      border-bottom: 3px solid var(--green);
    }
    header strong { font-size: 16px; }
    header nav { display: flex; align-items: center; gap: 6px; }
    header a { color: #dce7e2; text-decoration: none; padding: 7px 9px; }
    header a:hover { color: #fff; background: #34413e; }
    header form { margin-left: auto; }
    main { min-height: calc(100vh - 54px); }
    button, .button {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid #aab4b0;
      border-radius: 4px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }
    button:hover, .button:hover { border-color: var(--green); }
    button.primary { color: #fff; border-color: var(--green); background: var(--green); }
    input, select {
      width: 100%;
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid #b9c2bf;
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    input[type="checkbox"] { width: 18px; min-height: 18px; accent-color: var(--green); }
    label { color: #394441; font-size: 12px; font-weight: 650; }
    .messages { margin: 0; padding: 0; list-style: none; }
    .messages li { padding: 9px 18px; border-bottom: 1px solid var(--line); background: var(--green-soft); }
    .messages .error { color: #7f2020; background: #f8e1e1; }
    .muted { color: var(--muted); }
    .danger { color: var(--red); }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca5a2; }
    .status-dot.live { background: var(--green); }
    .status-dot.busy { background: var(--amber); }
    .status-dot.off { background: var(--red); }
    .status-dot.stale { background: #868e8c; }
    @media (max-width: 760px) {
      header { padding: 0 12px; gap: 10px; }
      header nav { display: none; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <strong>Terminal OES</strong>
    {% if request.user.is_authenticated %}
      <nav><a href="{% url 'equipment-console-list' %}">Equipment</a><a href="/admin/">Admin</a></nav>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
    {% endif %}
  </header>
  {% if messages %}<ul class="messages">{% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}</ul>{% endif %}
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
